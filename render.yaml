services:
  - type: web
    name: screenshot-to-code-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    startCommand: poetry run uvicorn main:app --host 0.0.0.0 --port ${PORT:-7001}
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: IS_PROD
        value: "true"